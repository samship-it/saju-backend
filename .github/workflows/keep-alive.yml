name: Keep Backend Awake

on:
  schedule:
    # Render 무료 플랜은 15분간 요청이 없으면 서버가 잠든다.
    # 그보다 짧은 주기로 헬스체크를 찔러 잠들지 않게 한다.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf -m 60 https://saju-backend-vd0a.onrender.com/ || echo "ping failed (server may be waking up) — not fatal"
